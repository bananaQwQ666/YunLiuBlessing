# 核心设置
post_cooldown: 60       # 发送祝福的冷却时间 (秒)
hologram:
  update_interval: 10   # 全息轮播间隔 (秒)
  max_line_length: 24   # 每行最大字数
  header: "&#0fb6ff✦ 云琉祝福 ✦"
  footer: "&7&m-----"

# 消息提醒
messages:
  enter_blessing: "&b[系统] 请在聊天栏输入你的祝福内容 (输入 cancel 取消)。"
  success: "&a[系统] 祝福已成功送达！"

# 菜单配置项 (Slot 自定义建议保持不变)
menu:
  main_title: "&#0fb6ff云琉祝福系统"
  post_button:
    slot: 2
    material: PAPER
    name: "&6&l发布新祝福"
    lore:
      - "&7点击向他人或全服送上你的祝福"
  my_button:
    slot: 4
    material: BOOK
    name: "&b&l我的祝福管理"
    lore:
      - "&7查看、修改或撤回我发出的祝福"
  all_button:
    slot: 6
    material: NETHER_STAR
    name: "&e&l查看大家的祝福"
    lore:
      - "&7浏览全服玩家的祝福，支持点赞/评论"

target_menu:
  title: "&#0fb6ff选择祝福对象"
  self:
    slot: 2
    material: PLAYER_HEAD
    name: "&a祝福自己"
    lore: ["&7这仅会出现在特定的个人全息位"]
  others:
    slot: 4
    material: WRITABLE_BOOK
    name: "&b祝福他人"
    lore: ["&7写给特定的某个玩家"]
  server:
    slot: 6
    material: BEACON
    name: "&e祝福全服"
    lore: ["&7出现在所有的全服全息点上"]
